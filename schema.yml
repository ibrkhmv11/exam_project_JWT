openapi: 3.0.3
info:
  title: Internet Shop API
  version: 1.0.0
  description: Django REST Framework yordamida yaratilgan Internet Magazin API
paths:
  /api/admin/orders/:
    get:
      operationId: admin_orders_list
      description: Barcha orderlarni chiqaradi. Faqat admin.
      tags:
      - Admin Orders
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
  /api/admin/orders/{id}/:
    patch:
      operationId: admin_orders_partial_update
      description: Order statusini o'zgartiradi. Faqat admin.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Admin Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminOrderUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminOrderUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminOrderUpdate'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderUpdateResponse'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Login qiladi va Token qaytaradi.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: Joriy login qilgan foydalanuvchi profilini chiqaradi.
      tags:
      - Auth
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Yangi foydalanuvchini ro'yxatdan o'tkazadi.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/cart/:
    get:
      operationId: cart_retrieve
      description: Joriy userning savatini chiqaradi.
      tags:
      - Cart
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/cart/add/:
    post:
      operationId: cart_add_create
      description: Mahsulotni savatga qo'shadi.
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartAdd'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartAdd'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartAdd'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartAddResponse'
          description: ''
  /api/cart/remove/:
    post:
      operationId: cart_remove_create
      description: Mahsulotni savatdan o'chiradi.
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRemove'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartRemove'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartRemove'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartRemoveResponse'
          description: ''
  /api/categories/:
    get:
      operationId: categories_list
      description: Barcha kategoriyalar ro'yxatini chiqaradi.
      tags:
      - Categories
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
    post:
      operationId: categories_create
      description: Yangi kategoriya yaratadi. Faqat admin.
      tags:
      - Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/likes/:
    get:
      operationId: likes_list
      description: Joriy userning barcha like qilgan mahsulotlari.
      tags:
      - Likes
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Like'
          description: ''
  /api/orders/:
    get:
      operationId: orders_list
      description: Joriy userning barcha buyurtmalarini chiqaradi.
      tags:
      - Orders
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/checkout/:
    post:
      operationId: orders_checkout_create
      description: Savatdagi mahsulotlardan buyurtma yaratadi.
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Checkout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Checkout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Checkout'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
          description: ''
  /api/products/:
    get:
      operationId: products_list
      description: Mahsulotlar ro'yxati. Pagination, Filter, Search va Ordering mavjud.
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Category slug bo'yicha filter.
      - in: query
        name: max_price
        schema:
          type: number
          format: double
        description: Maksimal narx.
      - in: query
        name: min_price
        schema:
          type: number
          format: double
        description: Minimal narx.
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Masalan: price, -price, -created_at'
      - in: query
        name: page
        schema:
          type: integer
        description: Sahifa raqami.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Bir sahifadagi mahsulotlar soni.
      - in: query
        name: search
        schema:
          type: string
        description: Name va description bo'yicha qidirish.
      tags:
      - Products
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
          description: ''
    post:
      operationId: products_create
      description: Yangi mahsulot yaratadi. Faqat admin.
      tags:
      - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/products/{id}/:
    get:
      operationId: products_retrieve
      description: Bitta mahsulotni chiqaradi.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Products
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    put:
      operationId: products_update
      description: Mahsulotni to'liq yangilaydi. Faqat admin.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: products_partial_update
      description: Mahsulotni qisman yangilaydi. Faqat admin.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    delete:
      operationId: products_destroy
      description: Mahsulotni o'chiradi. Faqat admin.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Products
      security:
      - tokenAuth: []
      responses:
        '204':
          description: Mahsulot o'chirildi.
  /api/products/{id}/comments/:
    get:
      operationId: products_comments_list
      description: Mahsulotga yozilgan barcha commentlarni chiqaradi.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Comments
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
          description: ''
    post:
      operationId: products_comments_create
      description: Mahsulotga comment va rating yozadi.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Comment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Comment'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
  /api/products/{id}/like/:
    post:
      operationId: products_like_create
      description: Mahsulotni like/unlike qiladi.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Likes
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeToggleResponse'
          description: ''
components:
  schemas:
    AdminOrderUpdateResponse:
      type: object
      properties:
        message:
          type: string
        order:
          $ref: '#/components/schemas/Order'
      required:
      - message
      - order
    Cart:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        total_quantity:
          type: string
          readOnly: true
        total_price:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - items
      - total_price
      - total_quantity
      - updated_at
      - user
    CartAdd:
      type: object
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
      required:
      - product_id
      - quantity
    CartAddResponse:
      type: object
      properties:
        message:
          type: string
        item:
          $ref: '#/components/schemas/CartItem'
      required:
      - item
      - message
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        subtotal:
          type: string
          readOnly: true
      required:
      - id
      - product
      - subtotal
    CartRemove:
      type: object
      properties:
        product_id:
          type: integer
      required:
      - product_id
    CartRemoveResponse:
      type: object
      properties:
        message:
          type: string
        product_id:
          type: integer
      required:
      - message
      - product_id
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        parent:
          type: integer
          nullable: true
      required:
      - id
      - name
      - slug
    Checkout:
      type: object
      properties:
        shipping_address:
          type: string
          minLength: 5
      required:
      - shipping_address
    CheckoutResponse:
      type: object
      properties:
        message:
          type: string
        order:
          $ref: '#/components/schemas/Order'
      required:
      - message
      - order
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        product:
          type: integer
          readOnly: true
        text:
          type: string
        rating:
          type: integer
          maximum: 32767
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - product
      - rating
      - text
      - user
      - username
    Like:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - product
    LikeToggleResponse:
      type: object
      properties:
        liked:
          type: boolean
        message:
          type: string
        product_id:
          type: integer
      required:
      - liked
      - message
      - product_id
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        user:
          $ref: '#/components/schemas/Profile'
      required:
      - message
      - token
      - user
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        shipping_address:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - items
      - shipping_address
      - status
      - total_price
      - username
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
          nullable: true
        product_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        price_at_that_time:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        subtotal:
          type: string
          readOnly: true
      required:
      - id
      - price_at_that_time
      - product_name
      - quantity
      - subtotal
    PatchedAdminOrderUpdate:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
    PatchedProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
        category_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        image:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    Product:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
        category_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        stock:
          type: integer
          maximum: 2147483647
          minimum: 0
        image:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - category_name
      - created_at
      - description
      - id
      - name
      - price
      - slug
    Profile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - id
      - role
      - username
    Register:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        password:
          type: string
          writeOnly: true
          minLength: 8
        confirm_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - confirm_password
      - email
      - id
      - password
      - username
    RegisterResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/Profile'
      required:
      - message
      - user
    RoleEnum:
      enum:
      - admin
      - customer
      type: string
      description: |-
        * `admin` - Admin
        * `customer` - Customer
    StatusEnum:
      enum:
      - pending
      - shipping
      - completed
      - cancelled
      type: string
      description: |-
        * `pending` - Kutilmoqda
        * `shipping` - Yetkazilmoqda
        * `completed` - Bajarildi
        * `cancelled` - Bekor qilindi
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
